[project]
name = "paperlens"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Simone Fornoni", email = "simonefornoni04@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastembed (>=0.8.0,<0.9)",
    "sentence-transformers (>=5.2.0,<6)",
    "grobid-client-python (>=0.1.4,<0.2)",
    "numpy (>=2.4.1,<3)",
    "ollama (>=0.6.1,<0.7)",
    "qdrant-client (>=1.17.1,<2)",
    "torch (>=2.10.0,<3)",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]


[tool.uv]
package = false
